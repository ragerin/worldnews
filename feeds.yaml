# feeds.yaml
#
# Fields:
#   name        - display name shown on the site
#   url         - feed URL to fetch
#   category    - geographic or topical section (drives nav pages)
#   topics      - list of topic tags for client-side filtering
#                 valid values: world, politics, business, technology, science, culture
#   language    - ISO 639-1 code
#   enabled     - false to disable without deleting config
#   confidence  - "high" / "medium" / "low" - how well-verified the URL is
#   notes       - caveats (ToS, attribution, verification gaps, etc.)

feeds:

  # =========================================================================
  # GLOBAL WIRE  (outlets with broad worldwide coverage)
  # =========================================================================

  - name: "BBC World News"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    category: "Global Wire"
    topics: [world, politics]
    language: "en"
    enabled: true
    confidence: "high"
    notes: "UK public broadcaster. Stable RSS, consistent format."

  - name: "Reuters World"
    url: "https://feeds.reuters.com/reuters/worldNews"
    category: "Global Wire"
    topics: [world, politics, business]
    language: "en"
    enabled: true
    confidence: "medium"
    notes: "Reuters has changed RSS URLs in the past — re-verify if feed goes silent."

  - name: "Al Jazeera English"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    category: "Global Wire"
    topics: [world, politics]
    language: "en"
    enabled: true
    confidence: "high"
    notes: "Qatar-based, partially state-funded. Broad global coverage."

  - name: "AP News"
    url: "https://rsshub.app/apnews/topics/apf-topnews"
    category: "Global Wire"
    topics: [world, politics]
    language: "en"
    enabled: false
    confidence: "low"
    notes: >
      AP does not publish an official RSS feed. This uses rsshub.app as a
      bridge — reliability depends on that third-party service. Enable only
      if you're comfortable with that dependency; alternatively find an
      official AP feed path if one is ever published.

